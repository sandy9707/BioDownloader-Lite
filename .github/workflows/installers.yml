name: Build Lite installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all platforms pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            label: Windows-x64
          - os: macos-latest
            args: --mac --arm64
            label: macOS-arm64
          - os: macos-15-intel
            args: --mac --x64
            label: macOS-x64
          - os: ubuntu-22.04
            args: --linux --x64
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use Windows system curl for fixture tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: curl.exe --version
      - run: npm test
      - run: npm run test:package
      - name: Desktop render smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs
      - name: Linux desktop render smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs
      - name: Build installers
        run: npm run dist -- ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BioDownloader-Lite-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: BioDownloader-Lite-*
          merge-multiple: true
          path: release-assets
      - name: Validate and publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release.mjs
